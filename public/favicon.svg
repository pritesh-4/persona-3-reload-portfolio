<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030814" />
      <stop offset="50%" stop-color="#0a1e38" />
      <stop offset="100%" stop-color="#001830" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#f43f7a" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Dark Hour base -->
  <polygon points="32,2 60,18 60,46 32,62 4,46 4,18" fill="url(#bg)" stroke="#00d4ff" stroke-width="2" />

  <!-- Diagonal Crimson Slash Ribbon -->
  <path d="M 6 48 L 58 16 L 50 12 L 2 44 Z" fill="url(#crimsonGrad)" opacity="0.85" />

  <!-- Persona Arc Track (Quadratic Curve) -->
  <path d="M 12 40 Q 32 16 52 40" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Central P3 Monogram -->
  <text x="32" y="38" font-family="'Anton', 'Impact', sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="1">P3</text>

  <!-- S.E.E.S. Active Node Marker -->
  <circle cx="32" cy="28" r="3.5" fill="#00d4ff" stroke="#ffffff" stroke-width="1.5" />
</svg>

